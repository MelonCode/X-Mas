# XMas Tree translations
# File: plugins/X-Mas/translations/locale_en.yml
#
# This file is the primary source of truth for:
# - player-facing text
# - admin command/debug wording
# - the chat/console prefix
# - the MiniMessage pastel theme aliases
#
# The plugin loads this file by default when core.locale is set to en.
# Custom locales can be added as:
# - plugins/X-Mas/translations/locale_fr.yml
# - plugins/X-Mas/translations/locale_de.yml
# and so on.

plugin-name: XMas Tree

theme:
 text: '#f7f1e8'
 muted: '#c7c0bb'
 accent: '#9fe3d6'
 accent-secondary: '#f4c2d7'
 label: '#f3d38f'
 success: '#b9e8b5'
 warning: '#f6d58b'
 error: '#f3a7a7'
 info: '#a9d4ff'
 command: '#f4c2d7'

format:
 prefix: '<xm-accent-2>[</xm-accent-2><xm-accent>{plugin_name}</xm-accent><xm-accent-2>]</xm-accent-2> <reset>'
 console-prefix: '<xm-accent-2>[</xm-accent-2><xm-accent>{plugin_name}</xm-accent><xm-accent-2>]</xm-accent-2> <xm-muted>'

messages:
 plugin-enabled: <xm-success>Merry Christmas and Happy New Year!</xm-success>
 timeout: <xm-warning>The holidays are over. See you next year!</xm-warning>
 final-wish: <xm-accent>Happy New Year to all of you, my friends!</xm-accent>

 tree:
  grow-lvl-ready: <xm-success>Woosh!</xm-success> <xm-text>Right-click the tree to let it grow.</xm-text>
  grow-lvl-progress: _UNUSED
  grow-req-list-title: Still needed
  grow-req-list-hint: <xm-muted>Right-click the tree while holding the listed ingredient items to feed them into the tree.</xm-muted>
  grow-not-enough-place: <xm-warning>There is not enough room for the tree to grow.</xm-warning>
  grow-lvl-max: <xm-warning>This tree has reached its maximum level.</xm-warning>
  tree-limit: <xm-warning>Hey, do not be greedy. You have reached your tree limit.</xm-warning>
  destroy-sapling: <xm-warning>You can cut down this tree.</xm-warning>
  destroy-leaves-santa: <xm-accent>Santa Claus sees everything.</xm-accent>
  destroy-leaves-tut: <xm-warning>To destroy a tree, cut the log.</xm-warning>
  destroy-warning: <xm-warning>You can cut down the tree. Hit it again to confirm.</xm-warning>
  destroy-resource-back: <xm-info>Your used upgrade items will be returned for collection.</xm-info>
  destroy-tut: <xm-muted>Hit it again to confirm.</xm-muted>
  destroy-fail-owner: <xm-error>It is not your tree.</xm-error>
  destroy-complete: <xm-success>Your tree has been packed away for the season.</xm-success>
  refund:
   chest: <xm-success>Your tree resources were returned in a chest.</xm-success>
   barrel: <xm-success>Your tree resources were returned in a barrel.</xm-success>
   inventory: <xm-success>Your tree resources were returned to your inventory.</xm-success>
   inventory-overflow: <xm-info>Your tree resources were returned. Inventory overflow dropped at the tree.</xm-info>

 gift:
  luck-message: _UNUSED
  unluck-message: <xm-muted>Probably Santa has put you on the blacklist. Better luck next time.</xm-muted>

crystal:
 name: <xm-accent>Christmas Crystal</xm-accent>
 lore:
  - <xm-label>Concentrated Christmas Spirit</xm-label>
  - <xm-muted>Use it on a spruce sapling to fill it with magic.</xm-muted>

command:
 help:
  - '<xm-text>Use </xm-text><xm-command>/xmastree</xm-command><xm-text> to show plugin version and status.</xm-text>'
  - '<xm-text>Use </xm-text><xm-command>/xmastree help</xm-command><xm-text> to show this command list.</xm-text>'
  - '<xm-text>Use </xm-text><xm-command>/xmastree info</xm-command><xm-text> to learn how the XMas Tree event works.</xm-text>'
  - '<xm-text>Use </xm-text><xm-command>/xmastree give \<player></xm-command><xm-text> to give a player a Christmas Crystal.</xm-text>'
  - '<xm-text>Use </xm-text><xm-command>/xmastree gifts</xm-command><xm-text> to spawn presents under all trees.</xm-text>'
  - '<xm-text>Use </xm-text><xm-command>/xmastree gifts list [page]</xm-command><xm-text> to list configured gift rewards.</xm-text>'
  - '<xm-text>Use </xm-text><xm-command>/xmastree gifts roll</xm-command><xm-text> to preview one weighted random gift roll.</xm-text>'
  - '<xm-text>Use </xm-text><xm-command>/xmastree gifts remove \<index></xm-command><xm-text> to remove a configured gift reward.</xm-text>'
  - '<xm-text>Use </xm-text><xm-command>/xmastree gifts weight \<index> \<weight></xm-command><xm-text> to set a gift roll weight.</xm-text>'
  - '<xm-text>Use </xm-text><xm-command>/xmastree gifts addhand</xm-command><xm-text> to add your held item as a gift.</xm-text>'
  - '<xm-text>Use </xm-text><xm-command>/xmastree reload</xm-command><xm-text> to reload config, translations, theme, and crystal item text.</xm-text>'
  - '<xm-text>Use </xm-text><xm-command>/xmastree inspect</xm-command><xm-text> to inspect the tree you are looking at.</xm-text>'
  - '<xm-text>Use </xm-text><xm-command>/xmastree test sound first|repeat [player]</xm-command><xm-text> to preview grow sound volume.</xm-text>'
  - '<xm-text>Use </xm-text><xm-command>/xmastree test particle \<level> [effect] [player]</xm-command><xm-text> to preview configured particles.</xm-text>'
  - '<xm-text>Use </xm-text><xm-command>/xmastree test refund [tree-uuid|nearest [player]]</xm-command><xm-text> to dry-run refund delivery for a tree.</xm-text>'
  - '<xm-text>Use </xm-text><xm-command>/xmastree data backup [trees|progress|all]</xm-command><xm-text> to back up event data.</xm-text>'
  - '<xm-text>Use </xm-text><xm-command>/xmastree data validate</xm-command><xm-text> to check saved tree data.</xm-text>'
  - '<xm-text>Use </xm-text><xm-command>/xmastree data report</xm-command><xm-text> to show the event wrap-up report.</xm-text>'
  - '<xm-text>Use </xm-text><xm-command>/xmastree data migrate-world \<from> \<to> [dry-run|apply]</xm-command><xm-text> to migrate saved tree world names.</xm-text>'
  - '<xm-text>Use </xm-text><xm-command>/xmastree journal [gui]</xm-command><xm-text> to view your tree journal and event progress.</xm-text>'
  - '<xm-text>Use </xm-text><xm-command>/xmastree milestones</xm-command><xm-text> to view and claim personal milestone rewards.</xm-text>'
  - '<xm-text>Use </xm-text><xm-command>/xmastree milestones test \<key> [player]</xm-command><xm-text> to preview personal milestone reward commands.</xm-text>'
  - '<xm-text>Use </xm-text><xm-command>/xmastree community</xm-command><xm-text> to view community milestone progress.</xm-text>'
  - '<xm-text>Use </xm-text><xm-command>/xmastree community test \<key></xm-command><xm-text> to preview community milestone reward commands.</xm-text>'
  - '<xm-text>Use </xm-text><xm-command>/xmastree debug</xm-command><xm-text> to open the status debug section.</xm-text>'
  - '<xm-text>Use </xm-text><xm-command>/xmastree debug status</xm-command><xm-text> and other categories for status, commands, permissions, placeholders, diagnostics, and toggles.</xm-text>'
  - '<xm-text>Use </xm-text><xm-command>/xmastree debug toggle \<key> true|false</xm-command><xm-text> to change supported global toggles.</xm-text>'
  - '<xm-text>Use </xm-text><xm-command>/xmastree end</xm-command><xm-text> to end the event.</xm-text>'
 info:
  - '<xm-accent><bold>XMas Tree Event Info</bold></xm-accent>'
  - '<xm-text>XMas Tree is the 1MoreBlock Christmas tree event plugin.</xm-text>'
  - '<xm-text>Get a </xm-text><xm-accent>Christmas Crystal</xm-accent><xm-text>, place a </xm-text><xm-label>spruce sapling</xm-label><xm-text>, then right-click the sapling with the crystal.</xm-text>'
  - '<xm-text>Right-click your tree while holding the listed ingredients to grow it through multiple levels.</xm-text>'
  - '<xm-text>Grown trees spawn gifts below them. Right-click those gifts to claim rewards.</xm-text>'
  - '<xm-text>After the event, break the tree log to remove the tree and reclaim the ingredients you spent.</xm-text>'
  - '<xm-text>Open gifts daily, weekly, and across all 25 event days to build streaks, hit personal milestones, and help unlock community milestones.</xm-text>'
  - '<xm-text>Useful commands: </xm-text><xm-command>/xmastree journal</xm-command><xm-muted>, </xm-muted><xm-command>/xmastree milestones</xm-command><xm-muted>, </xm-muted><xm-command>/xmastree community</xm-command>'
  - '<xm-text>Docs: </xm-text><xm-command><click:open_url:https://docs.1moreblock.com/custom-server-plugins/xmas-tree/>https://docs.1moreblock.com/custom-server-plugins/xmas-tree/</click></xm-command>'
  - '<xm-muted>Run </xm-muted><xm-command>/xmastree</xm-command><xm-muted> to see the installed plugin version and event status.</xm-muted>'
 player-offline: '<xm-error>Player not found.</xm-error>'
 no-player-name: '<xm-warning>Missing player name.</xm-warning>'
 giveaway: '<xm-accent-2>Ho!</xm-accent-2> <xm-accent>Ho!</xm-accent> <xm-label>Ho!</xm-label> <xm-info>Looks like it is time to check presents.</xm-info>'
  no-permission: '<xm-error>You do not have permission to use this command.</xm-error>'
  player-only: '<xm-error>Only players can use this command.</xm-error>'
  player-required: '<xm-error>Player name required.</xm-error>'
  community:
   confirm-required: '<xm-warning>Run the confirm command to claim this community milestone.</xm-warning>'
 hold-item-first: '<xm-error>Hold an item before running {command}.</xm-error>'
 gift-added: '<xm-success>Added the held item to the gift list.</xm-success>'
 reload-success: '<xm-success>{plugin_name} configuration reloaded.</xm-success>'
 inspect:
  not-found: '<xm-warning>No XMas Tree found nearby or in your line of sight.</xm-warning>'
 test:
  no-particles: '<xm-warning>No enabled particle effects matched that preview.</xm-warning>'
 data:
  backup-created: '<xm-success>Data backup created.</xm-success>'
  backup-failed: '<xm-error>Unable to back up data.</xm-error>'
  migration-applied: '<xm-warning>World migration saved. Restart the server before testing migrated trees.</xm-warning>'
  migration-failed: '<xm-error>Unable to migrate tree world names.</xm-error>'
progress:
 milestone:
  unknown: Unknown milestone.
  already-claimed: That milestone is already claimed.
  not-ready: That milestone is not ready yet.
  claimed: Milestone claimed!
  invalid: Skipping invalid milestone {key}
 history:
  tree-created: '{time} - Created {level} at {location} ({tree})'
  tree-removed: '{time} - Removed {level} at {location} ({tree})'
  player-milestone-claimed: '{time} - Claimed {display_name} ({key}) at {progress}/{target}'
  community-milestone-claimed: '{time} - {claimer} claimed {display_name} ({key}) at {progress}/{target}'

ui:
 status:
  title: '<xm-accent><bold>{plugin_name}</bold></xm-accent> <xm-text>{version}</xm-text> <xm-accent><bold>Plugin Status</bold></xm-accent>'
  labels:
   event-status: Event Status
   current-time: Current Time
   holidays-end: Holidays End
   auto-end: Auto-End
   resource-back: Resource Back
   particles: Particles
   loaded-trees: Loaded Trees
   tree-owners: Tree Owners
   help: Help
  values:
   in-progress: '<xm-success>In Progress</xm-success>'
   holidays-end: '<xm-error>Holidays End</xm-error>'

 command-descriptions:
  status: status
  help: command list
  info: how the XMas Tree event works
  give: give a Christmas Crystal
  gifts: spawn presents under all trees
  gifts-list: list configured gifts
  gifts-roll: preview a weighted random gift roll
  gifts-remove: remove a configured gift
  gifts-weight: set a gift roll weight
  gifts-addhand: add held item to gifts
  addhand: legacy shortcut for gifts addhand
  reload: reload config and translations
  inspect: inspect the tree you are looking at
  test-sound: preview grow sounds
  test-particle: preview configured particles
  test-refund: dry-run tree refund delivery
  data-backup: back up event data
  data-validate: validate trees.yml
  data-report: show event wrap-up report
  data-migrate-world: migrate saved tree world names
  journal: view your tree journal and event progress
  journal-gui: open the tree journal GUI
  milestones: view and claim milestone rewards
  milestones-test: preview personal milestone reward commands
  milestones-claim: claim a personal milestone reward
  community: view community milestone progress
  community-test: preview community milestone reward commands
  community-claim: claim a community milestone reward
  end: end the event
  debug: open the status debug section
  debug-section: extended debug output by category
  debug-toggle: toggle global booleans

 permission-descriptions:
  admin: allows all {plugin_name} commands and overrides
  status: shows /xmastree status output
  help: shows /xmastree help output
  info: shows /xmastree info output
  give: allows /xmastree give
  gifts: allows /xmastree gifts
  addhand: allows /xmastree gifts addhand and /xmastree addhand
  reload: allows /xmastree reload
  inspect: allows /xmastree inspect
  test: allows /xmastree test
  data: allows /xmastree data
  journal: allows /xmastree journal
  milestones: allows /xmastree milestones
  milestones-claim: allows /xmastree milestones claim
  community: allows /xmastree community
  community-claim: allows /xmastree community claim
  debug: allows /xmastree debug
  debug-toggle: allows /xmastree debug toggle
  end: allows /xmastree end
  tree-override: allows managing other players' trees

